name: Build and Release Firmware

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: true
        default: false
        type: boolean

env:
  # Default target environment - can be overridden
  TARGET_ENV: sunton-8048s043r_16MB

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: sunton-8048s043r_16MB
            out: sunton-8048s043r
          - env: sunton-8048s043c_16MB
            out: sunton-8048s043c
          - env: sunton-8048s050c_16MB
            out: sunton-8048s050c
          - env: sunton-8048s050n_16MB
            out: sunton-8048s050n
          - env: sunton-8048s070c_16MB
            out: sunton-8048s070c
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-${{ matrix.env }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install PlatformIO & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio dulwich
    
    - name: Enable ESP32 platforms from platformio_override-template.ini
      run: |
        sed 's/; user_setups/esp32/user_setups/esp32/g' platformio_override-template.ini > platformio_override.ini
    
    - name: Build firmware
      run: |
        pio run -e ${{ matrix.env }}
    
    - name: List build outputs
      run: |
        echo "=== Build outputs ==="
        ls -lah build_output/firmware/ || echo "No release output directory"
        echo "=== PlatformIO build dir ==="
        ls -lah .pio/build/${{ matrix.env }}/ || echo "No PIO build directory"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.out }}
        path: |
          build_output/firmware/*.bin
          .pio/build/${{ matrix.env }}/firmware.bin
        if-no-files-found: error
    
    - name: Zip artifact for deployment
      if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
      run: |
        zip ${{ matrix.out }}.zip build_output/firmware/*.bin -r
    
    - name: On Release, upload assets to that Release
      if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
      uses: AButler/upload-release-assets@v3.0
      with:
        files: ${{ matrix.out }}.zip
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # Create release on tag pushes, and optionally on manual runs
    if: (github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: build_output/firmware/
    
    - name: Get version info
      id: get_version
      run: |
        VERSION=$(grep "HASP_VER_REV" platformio.ini | head -1 | sed 's/.*HASP_VER_REV=//' | tr -d ' \t')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', steps.get_version.outputs.version, steps.get_version.outputs.short_sha) }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('openHASP v{0}', steps.get_version.outputs.version) }}
        body: |
          ## openHASP Firmware
          
          **Version:** ${{ steps.get_version.outputs.version }}  
          **Commit:** ${{ github.sha }}  
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          ### What's Included
          - XPT2046 Resistive Touch Support
          - ArduinoGFX Display Driver
          - Reproducible Docker-based build
          
          ### Flashing Instructions
          ```bash
          esptool.py --chip esp32s3 --port /dev/ttyUSB0 --baud 921600 
            write_flash 0x0 build_output/firmware/*_full_*.bin
          ```
          
          ### Files
          - `*_full_*.bin` - Full firmware image (first flash)
          - `*_ota_*.bin` - OTA update image
          
          ### Documentation
          - [README](https://github.com/${{ github.repository }}/blob/master/README.md)
          - [CHANGES](https://github.com/${{ github.repository }}/blob/master/CHANGES.md)
          
          ### Docker Build
          ```bash
          docker build -t openhasp-builder -f Dockerfile.platformio .
          docker run --rm -v "$(pwd):/workspace" openhasp-builder 
            pio run -e <environment>
          ```
        files: |
          build_output/firmware/*.bin
        fail_on_unmatched_files: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-status:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Build Status
      run: |
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ Build successful!"
          exit 0
        else
          echo "❌ Build failed!"
          exit 1
        fi